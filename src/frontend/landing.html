<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://xingxingzaishan.top/" />
    <title>记在星上</title>
    <script>
      const next = new URL('/', window.location.origin);
      new URLSearchParams(window.location.search).forEach((value, key) => next.searchParams.set(key, value));
      window.location.replace(next.toString());
    </script>
  </head>
  <body>
    <p><a href="/">前往“记在星上”首页</a></p>
  </body>
</html>
